<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#141414" />
<title>BulletRide</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="toast" class="toast"></div>

<header class="topbar">
  <h1>🏍️ BulletRide</h1>
  <div class="topbar-actions">
    <button id="btn-settings" class="icon-btn" title="Catégories">🎨</button>
  </div>
</header>

<nav class="yearbar">
  <button id="btn-prev-year" class="nav-btn" title="Année précédente">‹</button>
  <span id="year-label" class="year-label">2026</span>
  <button id="btn-next-year" class="nav-btn" title="Année suivante">›</button>
</nav>

<div class="today-cta">
  <button id="btn-today" class="btn-today">🏍️ J'ai roulé aujourd'hui</button>
</div>

<section id="stats" class="stats"></section>
<section id="stats-extra" class="stats-extra"></section>

<main id="year-grid" class="year-grid"></main>

<section id="legend" class="legend"></section>

<footer class="app-footer">
  <span>Touche un jour pour choisir une catégorie • données stockées sur ton appareil</span>
</footer>

<!-- Modale de choix de catégorie pour un jour -->
<div id="day-overlay" class="overlay hidden">
  <div class="modal">
    <div class="modal-head">
      <h2 id="day-modal-title">Jour</h2>
      <button id="btn-close-day" class="icon-btn" title="Fermer">✕</button>
    </div>
    <p class="hint">Choisis le type de sortie pour ce jour.</p>
    <div id="day-choices" class="day-choices"></div>
    <label class="note-field">
      <span class="note-label">Note (optionnel)</span>
      <textarea id="day-note" rows="3" maxlength="280" placeholder="Destination, avec qui, ressenti…"></textarea>
    </label>
    <div class="modal-actions modal-actions-end">
      <button id="btn-day-done" class="btn-primary">Terminé</button>
    </div>
  </div>
</div>

<!-- Modale de gestion des catégories -->
<div id="settings-overlay" class="overlay hidden">
  <div class="modal">
    <div class="modal-head">
      <h2>Catégories</h2>
      <button id="btn-close-settings" class="icon-btn" title="Fermer">✕</button>
    </div>
    <p class="hint">Personnalise le nom et la couleur de chaque catégorie.</p>
    <div id="cat-editor" class="cat-editor"></div>
    <button id="btn-add-cat" class="btn-secondary">+ Ajouter une catégorie</button>
    <div class="modal-actions">
      <button id="btn-reset-cats" class="btn-ghost">Réinitialiser</button>
      <button id="btn-save-cats" class="btn-primary">Enregistrer</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
